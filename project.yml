name: Capsulets
options:
  bundleIdPrefix: com.nasa9084
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_VERSION: "5.0"
targets:
  Capsulets:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nasa9084.capsulets
        CODE_SIGN_ENTITLEMENTS: Entitlements/Capsulets.entitlements
        GENERATE_INFOPLIST_FILE: YES
        # 生成される Info.plist に、このファイルの項目（URL スキームなど）が足される
        INFOPLIST_FILE: Supporting/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Capsulets
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme: {}


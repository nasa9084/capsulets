name: Capsulets
options:
  bundleIdPrefix: com.nasa9084
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_VERSION: "5.0"
packages:
  # かな漢字変換エンジン（辞書つき）。1.0 までは minor で破壊的変更がありうるので minor を固定する
  AzooKeyKanaKanjiConverter:
    url: https://github.com/azooKey/AzooKeyKanaKanjiConverter
    minorVersion: 0.11.2
targets:
  Capsulets:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
    dependencies:
      - target: CapsuletsKeyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nasa9084.capsulets
        CODE_SIGN_ENTITLEMENTS: Entitlements/Capsulets.entitlements
        GENERATE_INFOPLIST_FILE: YES
        # 生成される Info.plist に、このファイルの項目（URL スキームなど）が足される
        INFOPLIST_FILE: Supporting/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Capsulets
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme: {}

  # 日本語入力キーボード（フリック）
  CapsuletsKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
    dependencies:
      - package: AzooKeyKanaKanjiConverter
        product: KanaKanjiConverterModuleWithDefaultDictionary
    info:
      path: Keyboard/Info.plist
      properties:
        # SideStore は App ID 名にこの名前を使うので英数字にしておく
        CFBundleDisplayName: Kana
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: ja-JP
            # タイプ音を鳴らすのに「フルアクセスを許可」が必要
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nasa9084.capsulets.Keyboard

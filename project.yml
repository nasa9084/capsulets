name: Capsulets
options:
  bundleIdPrefix: com.nasa9084
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_VERSION: "5.0"
targets:
  Capsulets:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
    dependencies:
      - target: CapsuletsWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nasa9084.capsulets
        CODE_SIGN_ENTITLEMENTS: Entitlements/Capsulets.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Capsulets
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme: {}

  # 各 capsulet のウィジェットをまとめて入れる拡張機能（App ID を増やさないように1つにまとめる）
  CapsuletsWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        # SideStore は App ID 名にこの名前を使うので英数字にしておく
        CFBundleDisplayName: Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nasa9084.capsulets.Widgets
        CODE_SIGN_ENTITLEMENTS: Entitlements/CapsuletsWidgets.entitlements
